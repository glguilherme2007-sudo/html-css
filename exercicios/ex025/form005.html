<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formularios</h1>
    <form action="cadastro.php" method="get" autocomplete="on"></form>
    <fieldset>
        <legend>sexo</legend>
        <input type="radio" name="sexo" id="ismax" value="M"> <label for="ismax">Masculino</label> <br>
        <input type="radio" name="sexo" id="isfem" checked value="F"> <label for="isfem">Feminino</label><br>
    </fieldset>
    <fieldset>
        <legend>Esportes favoritos</legend>
        <input type="checkbox" name="esbas" id="iesbas" checked> <label for="iesbas">Basquete</label> <br>
        <input type="checkbox" name="esfut" id="iesfut" checked> <label for="iesfut">Futebol</label> <br>
        <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
        <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tenis</label> <br> 
    </fieldset>


    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="limpar">
    </p>

</body>
</html>
